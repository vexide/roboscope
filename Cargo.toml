[package]
name = "examples"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["ipc", "viewer", "simulator"]

[workspace.dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.25.0", features = ["must_cast"] }
derive_more = "2.1.1"
fast_image_resize = { version = "6.0.0", features = ["bytemuck"] }
iceoryx2 = "0.9.3"
image = { version = "0.25.9", default-features = false, features = ["png"] }
socket2 = "0.6.3"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
vex-sdk = "0.29.0-rc.1"

[dev-dependencies]
embedded-graphics = { version = "0.8.2", default-features = false }
tinybmp = "0.7.0"
tracing-subscriber.workspace = true
vex-sdk.workspace = true

[target.'cfg(target_os = "vexos")'.dev-dependencies]
vexide = { version = "0.9.0-alpha.1", features = ["full", "default-sdk"] }

[target.'cfg(not(target_os = "vexos"))'.dev-dependencies]
vexide = { version = "0.9.0-alpha.1", features = ["startup", "macros"] }
vex-sdk-desktop = { path = "./simulator" }
